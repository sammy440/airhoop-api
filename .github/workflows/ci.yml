name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "17 4 * * *" # nightly: catches drift when the frontend changes
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: airhoops
          POSTGRES_PASSWORD: airhoops
          POSTGRES_DB: airhoops_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://airhoops:airhoops@localhost:5432/airhoops_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13" # same as the Dockerfile
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest

  migrations:
    # Migrations run on every deploy (start.sh); make sure they apply to an empty database
    # and leave nothing the models have that the migrations don't.
    name: Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: airhoops
          POSTGRES_PASSWORD: airhoops
          POSTGRES_DB: airhoops
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://airhoops:airhoops@localhost:5432/airhoops
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: alembic upgrade head
      - name: Models match the migrations
        run: alembic check
      - name: Downgrade to base and back
        run: alembic downgrade base && alembic upgrade head

  parity-fixtures:
    # tests/fixtures/physics_parity.json is generated by the frontend. Regenerate it from the
    # frontend's master: a diff means one side changed physics without the other.
    name: Parity fixtures match the frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: airhoops-backend
      - uses: actions/checkout@v5
        with:
          repository: sammy440/airhoops
          path: airhoops-frontend
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: airhoops-frontend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: airhoops-frontend
      - run: GEN_PARITY=1 npx vitest run src/lib/game/parity.gen.test.ts
        working-directory: airhoops-frontend
      - name: Fixture is up to date
        working-directory: airhoops-backend
        run: |
          if ! git diff --quiet tests/fixtures/physics_parity.json; then
            echo "::error::tests/fixtures/physics_parity.json differs from what the frontend's master generates."
            echo "Regenerate it: GEN_PARITY=1 npx vitest run src/lib/game/parity.gen.test.ts (in the frontend), port the change to app/game/, commit both."
            git diff --stat
            exit 1
          fi
