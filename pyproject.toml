[project]
name = "airhoops-api"
version = "0.1.0"
description = "AirHoops backend: guest auth, rooms, WebSocket presence, leaderboards"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlmodel>=0.0.22",
  "alembic>=1.14",
  "pydantic-settings>=2.6",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-timeout>=2.3", "httpx>=0.28"]
monitoring = ["sentry-sdk[fastapi]>=2.18"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
